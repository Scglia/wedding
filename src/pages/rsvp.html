<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{rsvp_heading}} · {{site_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  {{> header page="rsvp.html"}}
  <section class="hero">
    <p class="eyebrow">{{site_title}}</p>
    <h1>{{rsvp_heading}}</h1>
    <div class="ornament" aria-hidden="true">❦</div>
    <p class="hero-meta">{{date}} · {{location}}</p>
  </section>
  <main>
    <section class="card">
      <p class="lead">{{rsvp_intro}}</p>
      <form>
        <div class="field">
          <label for="name">{{name_label}}</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">{{email_label}}</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <fieldset>
          <legend>{{attending_label}}</legend>
          <div class="choices">
            <label><input type="radio" name="attending" value="yes" required> {{attending_yes}}</label>
            <label><input type="radio" name="attending" value="no"> {{attending_no}}</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="guests">{{guests_label}}</label>
          <select id="guests" name="guests">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>

        <fieldset>
          <legend>{{accommodation_label}}</legend>
          <div class="choices">
            <label><input type="radio" name="accommodation" value="yes"> {{accommodation_yes}}</label>
            <label><input type="radio" name="accommodation" value="no"> {{accommodation_no}}</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="dietary">{{dietary_label}} <span class="hint">{{optional_hint}}</span></label>
          <textarea id="dietary" name="dietary" placeholder="{{dietary_placeholder}}"></textarea>
        </div>

        <div class="field">
          <label for="song">{{song_label}} <span class="hint">{{optional_hint}}</span></label>
          <input type="text" id="song" name="song">
        </div>

        <div class="field">
          <label for="message">{{message_label}} <span class="hint">{{optional_hint}}</span></label>
          <textarea id="message" name="message"></textarea>
        </div>

        <button type="submit">{{submit_button}}</button>
      </form>
    </section>
    <p class="back-link"><a class="text-link" href="/{{lang}}/">{{home_link}}</a></p>
  </main>
  <footer>
    <p>{{footer}}</p>
  </footer>
</body>
</html>
