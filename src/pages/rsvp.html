<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{rsvp_heading}} · {{site_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  {{> header page="rsvp.html"}}
  <section class="hero">
    <p class="eyebrow">{{site_title}}</p>
    <h1>{{rsvp_heading}}</h1>
    <div class="ornament" aria-hidden="true">❦</div>
    <p class="hero-meta">{{date}} · {{location}}</p>
  </section>
  <main>
    <section class="card">
      <p class="lead">{{rsvp_intro}}</p>
      <form>
        <div class="field">
          <label for="name">{{name_label}}</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">{{email_label}}</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <fieldset>
          <legend>{{attending_label}}</legend>
          <div class="choices">
            <label><input type="radio" name="attending" value="yes" required> {{attending_yes}}</label>
            <label><input type="radio" name="attending" value="no"> {{attending_no}}</label>
          </div>
        </fieldset>

        <div class="guest-counts">
          <div class="field">
            <label for="adults">{{adults_label}}</label>
            <input type="number" id="adults" name="adults" min="1" max="10" step="1" value="1" required>
          </div>

          <div class="field">
            <label for="children">{{children_label}}</label>
            <input type="number" id="children" name="children" min="0" max="10" step="1" value="0">
          </div>
        </div>

        <div class="field child-ages" id="child-ages" hidden></div>

        <fieldset>
          <legend>{{transportation_label}}</legend>
          <div class="choices">
            <label><input type="radio" name="transportation" value="car"> {{transportation_car}}</label>
            <label><input type="radio" name="transportation" value="train"> {{transportation_train}}</label>
            <label><input type="radio" name="transportation" value="plane"> {{transportation_plane}}</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="dietary">{{dietary_label}} <span class="hint">{{optional_hint}}</span></label>
          <textarea id="dietary" name="dietary" placeholder="{{dietary_placeholder}}"></textarea>
        </div>

        <div class="field">
          <label for="song">{{song_label}} <span class="hint">{{optional_hint}}</span></label>
          <input type="text" id="song" name="song">
        </div>

        <div class="field">
          <label for="message">{{message_label}} <span class="hint">{{optional_hint}}</span></label>
          <textarea id="message" name="message"></textarea>
        </div>

        <button type="submit">{{submit_button}}</button>
      </form>
    </section>
    <p class="back-link"><a class="text-link" href="/{{lang}}/">{{home_link}}</a></p>
  </main>
  <footer>
    <p>{{footer}}</p>
  </footer>
  <script>
    (function () {
      var childrenInput = document.getElementById("children");
      var childAges = document.getElementById("child-ages");

      function renderChildAges() {
        var count = Math.max(0, Math.min(10, parseInt(childrenInput.value, 10) || 0));
        childAges.innerHTML = "";
        childAges.hidden = count === 0;

        for (var i = 1; i <= count; i++) {
          var field = document.createElement("div");
          field.className = "field";

          var label = document.createElement("label");
          label.setAttribute("for", "child-age-" + i);
          label.textContent = "{{child_age_label}} " + i;

          var input = document.createElement("input");
          input.type = "number";
          input.id = "child-age-" + i;
          input.name = "child_age_" + i;
          input.min = "0";
          input.max = "17";
          input.step = "1";
          input.required = true;

          field.appendChild(label);
          field.appendChild(input);
          childAges.appendChild(field);
        }
      }

      childrenInput.addEventListener("input", renderChildAges);
      renderChildAges();
    })();
  </script>
</body>
</html>
