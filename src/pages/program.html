<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{program_heading}} · {{site_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  {{> view-transitions}}
</head>
<body>
  {{> header page="program.html"}}
  <section class="hero">
    <p class="eyebrow">{{site_title}}</p>
    <h1>{{program_heading}}</h1>
    <div class="ornament" aria-hidden="true">❦</div>
    <p class="hero-meta">{{program_intro}}</p>
  </section>
  <main>
    {{#each program_days}}
    <section class="card">
      <h2>{{name}}</h2>
      <p class="day-tagline">{{tagline}}</p>
      <ul class="schedule">
        {{#each events}}
        <li>
          <span class="time">{{time}}</span>
          <span class="event"><strong>{{title}}</strong> <span>{{desc}}</span></span>
        </li>
        {{/each}}
      </ul>
    </section>
    {{/each}}
    <p class="back-link"><a class="button" href="/{{lang}}/rsvp.html">{{rsvp_link}}</a></p>
  </main>
</body>
</html>
