<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{site_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  {{> header page=""}}
  <section class="hero">
    <p class="eyebrow">{{site_title}}</p>
    <h1>{{hero}}</h1>
    <div class="ornament" aria-hidden="true">❦</div>
    <p class="hero-meta">{{date}} · {{location}}</p>
  </section>
  <main>
    <section class="card">
      <h2>{{title}}</h2>
      <p class="lead">{{welcome}}</p>
      <dl class="details">
        <div>
          <dt>{{date_label}}</dt>
          <dd>{{date}}</dd>
        </div>
        <div>
          <dt>{{location_label}}</dt>
          <dd>{{location}}</dd>
        </div>
      </dl>
      <a class="button" href="/{{lang}}/rsvp.html">{{rsvp_link}}</a>
    </section>
  </main>
  <footer>
    <p>{{footer}}</p>
  </footer>
</body>
</html>
